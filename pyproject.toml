[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-ops-agent"
version = "0.1.0"
description = "Enterprise Knowledge Ops Agent — LangGraph multi-agent RAG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "langchain>=0.3.0,<0.4",
  "langchain-core>=0.3.0,<0.4",
  "langchain-community>=0.3.0,<0.4",
  "langchain-openai>=0.2.0,<0.3",
  "langgraph>=0.2.0,<0.3",
  "chromadb>=0.5.0,<0.6",
  "tiktoken>=0.7.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0.0",
  "streamlit>=1.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]

[project.scripts]
knowledge-ops = "app.cli:main"
knowledge-ops-ingest = "knowledge_ops.ingest:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["knowledge_ops*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
